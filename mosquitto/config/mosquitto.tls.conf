# Mosquitto TLS config — untuk Raspberry Pi (taruh di /etc/mosquitto/conf.d/tls.conf)
# Sertifikat dibuat oleh tools/gen_mqtt_tls.sh -> /etc/mosquitto/certs/
#
# Pastikan mosquitto.conf utama TIDAK punya "listener 1883" lain / allow_anonymous true.

per_listener_settings true

# --- ESP8266 (via AP smsb-iot) : HANYA TLS ---
listener 8883
protocol mqtt
cafile   /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server.crt
keyfile  /etc/mosquitto/certs/server.key
tls_version tlsv1.2
allow_anonymous false
password_file /etc/mosquitto/passwd

# --- HubBrain (main.py, proses di Pi yang sama) : plaintext HANYA di loopback ---
# Tidak lewat jaringan. Kalau mau semuanya TLS, hapus blok ini lalu set MQTT_TLS=true,
# MQTT_PORT=8883, MQTT_CA_CERT=ca.crt di hub/.env.
listener 1883 127.0.0.1
allow_anonymous false
password_file /etc/mosquitto/passwd
