# ==============================================================================
# Nginx Same-Origin Production Configuration for SMSB Platform (genset VPS)
#
# Architecture:
# - Port 80: HTTP -> HTTPS 301 Permanent Redirect
# - Port 443: TLS Termination, Security Headers, Same-Origin SPA + API Routing
#   - location /       -> Serves built React Vite SPA (/var/www/gui-app)
#   - location /api/   -> Reverse proxies to FastAPI / Uvicorn (127.0.0.1:8000)
#   - location /static/-> Uploaded floor plans & images; falls back to API proxy
#
# Certs: self-signed, SANs = public IP + Tailscale IP + genset
#        (/etc/nginx/ssl/smsb.crt|.key). Site name on VPS: 'hubgate'.
# ==============================================================================

# HTTP Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS Same-Origin Production Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # --------------------------------------------------------------------------
    # SSL / TLS Settings (self-signed cert â€” see HSTS note below)
    # --------------------------------------------------------------------------
    ssl_certificate     /etc/nginx/ssl/smsb.crt;
    ssl_certificate_key /etc/nginx/ssl/smsb.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # --------------------------------------------------------------------------
    # Gzip compression (text payloads: API JSON + SPA assets)
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types application/json text/css application/javascript image/svg+xml;

    # --------------------------------------------------------------------------
    # Security Headers
    # --------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # NO HSTS while the cert is self-signed (would hard-pin browsers to an
    # untrusted chain and brick access on cert rotation). Enable ONLY after a
    # publicly-trusted CA certificate (e.g. Let's Encrypt) is installed AND
    # verified in production for at least one full renewal cycle:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --------------------------------------------------------------------------
    # Upload limits (Floor plan images)
    # --------------------------------------------------------------------------
    client_max_body_size 10M;

    # --------------------------------------------------------------------------
    # 1. API Reverse Proxy (FastAPI Uvicorn on 127.0.0.1:8000)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / Connection upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }

    # --------------------------------------------------------------------------
    # 2. Static Uploads (Floor plans, icons, assets) + API fallback
    # --------------------------------------------------------------------------
    location /static/ {
        alias /opt/smsb/server/static/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        # re-declared: this block's add_header suppresses inheritance
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;

        # Fallback to backend API if file not found directly on disk
        try_files $uri @api_backend;
    }

    location @api_backend {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 3. Built Frontend SPA Static Files (Vite hashed build output)
    # --------------------------------------------------------------------------
    # Vite content-hashed assets (js/css/fonts/images under /assets/) are
    # immutable: cache aggressively for one year.
    location /assets/ {
        root /var/www/gui-app;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # re-declared: this block's add_header suppresses inheritance
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # Root and Client-Side Routing Fallback (index.html)
    location / {
        root /var/www/gui-app;
        try_files $uri $uri/ /index.html;

        # Ensure index.html is never cached so SPA updates load immediately
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            # re-declared: this block's add_header suppresses inheritance
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            expires 0;
        }
    }
}
