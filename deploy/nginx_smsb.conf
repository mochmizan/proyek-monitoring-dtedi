# ==============================================================================
# Nginx Same-Origin Production Configuration for SMSB Platform (Milestone 10)
# 
# Architecture:
# - Port 80: HTTP -> HTTPS 301 Permanent Redirect
# - Port 443: TLS Termination, Security Headers, Same-Origin SPA + API Routing
#   - location /       -> Serves React Vite SPA static build (/clients/gui-app/dist)
#   - location /api/   -> Reverse proxies to FastAPI / Uvicorn (127.0.0.1:8000)
#   - location /static/-> Serves uploaded floor plans & images (/SERVERv5/v5/static)
# ==============================================================================

# HTTP Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS Same-Origin Production Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # --------------------------------------------------------------------------
    # SSL / TLS Settings
    # --------------------------------------------------------------------------
    ssl_certificate     /opt/smsb/SERVERv5/v5/cert.crt;
    ssl_certificate_key /opt/smsb/SERVERv5/v5/cert.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # --------------------------------------------------------------------------
    # Security Headers
    # --------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Uncomment HSTS after verifying CA certificate in production:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --------------------------------------------------------------------------
    # Upload limits (Floor plan images)
    # --------------------------------------------------------------------------
    client_max_body_size 10M;

    # --------------------------------------------------------------------------
    # 1. API Reverse Proxy (FastAPI Uvicorn)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / Connection upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }

    # --------------------------------------------------------------------------
    # 2. Static Uploads (Floor plans, icons, assets)
    # --------------------------------------------------------------------------
    location /static/ {
        alias /opt/smsb/SERVERv5/v5/static/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;

        # Fallback to backend API if file not found directly on disk
        try_files $uri @api_backend;
    }

    location @api_backend {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 3. Built Frontend SPA Static Files (Vite React Build)
    # --------------------------------------------------------------------------
    # Hashed build assets (CSS, JS, images, fonts) - Cache immutably for 1 year
    location ~* ^/assets/(.+\.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?))$ {
        root /opt/smsb/clients/gui-app/dist;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Root and Client-Side Routing Fallback (index.html)
    location / {
        root /opt/smsb/clients/gui-app/dist;
        try_files $uri $uri/ /index.html;

        # Ensure index.html is never cached so updates load immediately
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires 0;
        }
    }
}
