[platformio]
default_envs = promini
src_dir = firmware


[common_esp8266]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@2.8.0
    bblanchon/ArduinoJson@6.21.5
    adafruit/Adafruit GFX Library@1.11.11
    adafruit/Adafruit SSD1306@2.5.13
    adafruit/Adafruit SHT31 Library@2.2.2

[env:wemos_ac]
extends = common_esp8266
build_src_filter = +<wemos_ac/main.cpp>
lib_deps =
    ${common_esp8266.lib_deps}
    crankyoldgit/IRremoteESP8266@2.8.6

[env:wemos_ts]
extends = common_esp8266
build_src_filter = +<wemos_ts/main.cpp>


[env:wemos_ats]
extends = common_esp8266
build_src_filter = +<wemos_ats/main.cpp>


[env:promini]
platform = atmelavr
board = pro16MHzatmega328
framework = arduino
monitor_speed = 115200
build_src_filter = +<promini_ats/main.cpp>

[env:test_hall]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
build_src_filter = +<wemos_ac/test_hall.cpp>
