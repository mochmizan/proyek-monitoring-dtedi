; firmware/platformio.ini — lib pins for all ESP8266 nodes (single source of truth)
; PlatformIO will compile each sketch dir as an env; arduino-cli uses installed libs.
; Pins keep fleet reproducible; see docs/FIRMWARE_ALIGNMENT_REPORT.md Component 5 (P5 dedup).

[platformio]
default_envs = wemos_ts, wemos_ac, wemos_ats

[common]
platform = espressif8266@4.2.1
framework = arduino
board = d1_mini
monitor_speed = 115200
lib_deps =
  knolleary/PubSubClient@2.8.0
  bblanchon/ArduinoJson@6.21.5
  adafruit/Adafruit GFX Library@1.11.11
  adafruit/Adafruit SSD1306@2.5.13
  adafruit/Adafruit BusIO@1.16.2
  adafruit/Adafruit SHT31 Library@2.2.2
  crankyoldgit/IRremoteESP8266@2.8.6

[env:wemos_ts]
extends = common
build_src_filter = +<../WEMOS_TS/WEMOS_TS.ino>

[env:wemos_ac]
extends = common
build_src_filter = +<../WEMOS_AC/WEMOS_AC.ino>

[env:wemos_ats]
extends = common
build_src_filter = +<../WEMOS_ATS/WEMOS_ATS.ino>
