[project]
name = "hubgatev5"
version = "0.1.0"
description = "HubGate V5 — FastAPI cloud gateway for IoT smart-building monitoring"
readme = "README.txt"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.136.1",
  "uvicorn==0.46.0",
  "pydantic==2.13.3",
  "sqlalchemy==2.0.49",
  "psycopg2-binary==2.9.12",
  "python-dotenv==1.2.3",
  "slowapi==0.1.10",
  "argon2-cffi==25.1.0",
  "python-multipart==0.0.27",
  "apscheduler==3.10.4",
  "tzdata==2025.2",
  "python-json-logger==2.0.7",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "-q"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
